                    s.hrAvgSession&&React.createElement("span",{style:{color:"#fb923c",fontWeight:400}},"♥"+s.hrAvgSession),

                    maxLa&&React.createElement("span",{style:{color:maxLa>4?"#f87171":maxLa>1.5?"#facc15":"#a78bfa",fontWeight:400}},"La"+maxLa)
                  ),
                  s.note&&React.createElement("div",{style:{fontSize:10,color:"#475569",marginTop:2,fontStyle:"italic"}},s.note)
                ),
                React.createElement("div",{style:{display:"flex",gap:2,alignItems:"center"}},
                  [1,2,3,4,5].map(n=>React.createElement("div",{key:n,style:{width:4,height:4,borderRadius:"50%",background:s.condition>=n?"#38bdf8":"#1e293b"}})),
                  React.createElement("span",{style:{fontSize:9,color:"#475569",marginLeft:4}},exp?"▲":"▼")
                )
              ),
              exp&&React.createElement("div",{style:{borderTop:"1px solid #1e293b",padding:"12px"}},
                s.intervalSets?.map((set,si)=>
                  React.createElement("div",{key:si,style:{marginBottom:12}},
                    React.createElement("div",{style:{fontSize:10,color:"#38bdf8",letterSpacing:2,marginBottom:5}},set.setLabel||"セット"+(si+1)),
                    React.createElement("div",{style:{overflowX:"auto"}},
                      React.createElement("table",{style:{borderCollapse:"collapse",fontSize:11,minWidth:420}},
                        React.createElement("thead",null,React.createElement("tr",{style:{background:"#0d1826"}},
                          ["#","ペース","HR最","HR均","レスト","乳酸","メモ"].map(h=>React.createElement("th",{key:h,style:{padding:"4px 7px",color:"#475569",fontWeight:400,fontSize:9,textAlign:"left",whiteSpace:"nowrap"}},h))
                        )),
                        React.createElement("tbody",null,
                          set.reps.map((r,ri)=>{
                            const pp=ri>0?p2n(set.reps[ri-1].pace):null,tp=p2n(r.pace),faster=pp&&tp&&tp<pp;
                            return React.createElement("tr",{key:ri,style:{borderTop:"1px solid #1a2030"}},
                              React.createElement("td",{style:{padding:"4px 7px",color:"#475569"}},ri+1),
                              React.createElement("td",{style:{padding:"4px 7px",fontWeight:600,color:faster?"#4ade80":"#e2e8f0"}},r.pace||"—",faster?" ↑":""),
                              React.createElement("td",{style:{padding:"4px 7px",color:"#f87171"}},r.hrPeak||"—"),
                              React.createElement("td",{style:{padding:"4px 7px",color:"#fb923c"}},r.hrAvg||"—"),
                              React.createElement("td",{style:{padding:"4px 7px",color:"#4ade80"}},r.hrRest||"—"),
                              React.createElement("td",{style:{padding:"4px 7px",color:r.lactate>4?"#f87171":r.lactate>1.5?"#facc15":"#a78bfa"}},r.lactate||"—"),
                              React.createElement("td",{style:{padding:"4px 7px",color:"#64748b",fontStyle:"italic"}},r.note||"")
                            );
                          })
                        )
                      )
                    ),
                    (()=>{
                      const pcs=set.reps.map(r=>p2n(r.pace)).filter(Boolean);
                      const has=set.reps.map(r=>parseInt(r.hrAvg)).filter(Boolean);
                      const rsts=set.reps.map(r=>parseInt(r.hrRest)).filter(Boolean);
                      return React.createElement("div",{style:{fontSize:10,color:"#475569",marginTop:5,display:"flex",gap:12,flexWrap:"wrap"}},
                        pcs.length>0&&React.createElement("span",null,"avg ",React.createElement("span",{style:{color:"#38bdf8"}},n2p(pcs.reduce((a,b)=>a+b,0)/pcs.length))),
                        pcs.length>0&&React.createElement("span",null,"best ",React.createElement("span",{style:{color:"#4ade80"}},n2p(Math.min(...pcs)))),
                        has.length>0&&React.createElement("span",null,"avgHR ",React.createElement("span",{style:{color:"#fb923c"}},Math.round(has.reduce((a,b)=>a+b,0)/has.length))),
                        rsts.length>0&&React.createElement("span",null,"minRest ",React.createElement("span",{style:{color:"#4ade80"}},Math.min(...rsts)))
                      );
                    })()
                  )
                ),
                s.lactateMeasurements?.filter(m=>m.value).length>0&&React.createElement("div",{style:{marginBottom:10}},
                  React.createElement("div",{style:{fontSize:9,letterSpacing:3,color:"#7c3aed",marginBottom:5}},"乳酸タイムライン"),
                  React.createElement("div",{style:{display:"flex",gap:6,alignItems:"flex-end",flexWrap:"wrap"}},
                    s.lactateMeasurements.filter(m=>m.value).map((m,i)=>{
                      const pct=Math.min(100,(m.value/7)*100),col=m.value>4?"#f87171":m.value>1.5?"#facc15":"#4ade80";
                      return React.createElement("div",{key:i,style:{textAlign:"center",minWidth:50}},
                        React.createElement("div",{style:{fontSize:11,fontWeight:700,color:col,marginBottom:2}},m.value),
                        React.createElement("div",{style:{height:42,width:34,margin:"0 auto",background:"#1e293b",borderRadius:3,display:"flex",alignItems:"flex-end",overflow:"hidden"}},
                          React.createElement("div",{style:{width:"100%",height:pct+"%",background:col,minHeight:3}})
                        ),
                        React.createElement("div",{style:{fontSize:9,color:"#475569",marginTop:3}},m.timing)
                      );
                    })
                  )
                ),
                React.createElement("div",{style:{display:"flex",gap:8,marginTop:4}},
                  React.createElement("button",{onClick:()=>startEdit(s),style:{padding:"5px 12px",background:"transparent",border:"1px solid #1e293b",color:"#64748b",fontSize:11,cursor:"pointer",borderRadius:3}},"編集"),
                  React.createElement("button",{onClick:()=>{save(sessions.filter(x=>x.id!==s.id));setExpandedId(null);},style:{padding:"5px 12px",background:"transparent",border:"1px solid #3b1f1f",color:"#f87171",fontSize:11,cursor:"pointer",borderRadius:3}},"削除")
                )
              )
            );
          })
        )
      ),

      // ── STATS VIEW ──
      view==="stats" && React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:22}},
        React.createElement("div",{style:{fontSize:9,letterSpacing:4,color:"#475569"}},"// 分析・予測"),
        paceTrend&&React.createElement("div",{style:{padding:"16px",background:"#0a0a14",border:"1px solid "+(paceTrend.up?"#166534":"#7f1d1d"),borderRadius:6}},
          React.createElement("div",{style:{fontSize:9,letterSpacing:4,color:"#475569",marginBottom:5}},"トレンド予測"),
          React.createElement("div",{style:{fontSize:22,fontWeight:700,color:paceTrend.up?"#4ade80":"#f87171"}},paceTrend.up?"▲ 改善中":"▼ 要注意"),
          React.createElement("div",{style:{fontSize:12,color:"#94a3b8",marginTop:5}},"平均 ",React.createElement("span",{style:{color:"#f1f5f9"}},paceTrend.avg+"/km"),"。",paceTrend.up?" "+paceTrend.trend+"分速くなっています。":paceTrend.trend+"分落ちています。回復を優先。")
        ),
        React.createElement("div",null,
          React.createElement("div",{style:{fontSize:9,letterSpacing:3,color:"#475569",marginBottom:8}},"週間走行距離 (km)"),
          React.createElement(ResponsiveContainer,{width:"100%",height:130},
            React.createElement(BarChart,{data:weeklyData,margin:{top:0,right:0,bottom:0,left:-20}},
              React.createElement(XAxis,{dataKey:"week",tick:{fill:"#475569",fontSize:9},axisLine:false,tickLine:false}),
              React.createElement(YAxis,{tick:{fill:"#475569",fontSize:9},axisLine:false,tickLine:false}),
              React.createElement(Tooltip,{contentStyle:{background:"#0f172a",border:"1px solid #1e293b",fontSize:11}}),
              React.createElement(Bar,{dataKey:"distance",fill:"#0369a1",radius:[3,3,0,0]})
            )
          )
        ),
        React.createElement("div",null,
          React.createElement("div",{style:{fontSize:9,letterSpacing:3,color:"#475569",marginBottom:8}},"ペース推移"),
          React.createElement(ResponsiveContainer,{width:"100%",height:130},
            React.createElement(LineChart,{data:paceData,margin:{top:0,right:0,bottom:0,left:-20}},
              React.createElement(XAxis,{dataKey:"date",tick:{fill:"#475569",fontSize:9},axisLine:false,tickLine:false}),
              React.createElement(YAxis,{tick:{fill:"#475569",fontSize:9},axisLine:false,tickLine:false,reversed:true,domain:["auto","auto"]}),
              React.createElement(Tooltip,{contentStyle:{background:"#0f172a",border:"1px solid #1e293b",fontSize:11},formatter:v=>[n2p(v)+" /km","ペース"]}),
              React.createElement(Line,{type:"monotone",dataKey:"pace",stroke:"#38bdf8",strokeWidth:2,dot:{r:3,fill:"#38bdf8"}})
            )
          )
        ),
        allLa.length>1&&React.createElement("div",null,
          React.createElement("div",{style:{fontSize:9,letterSpacing:3,color:"#475569",marginBottom:8}},"乳酸値 全測定ポイント"),
          React.createElement(ResponsiveContainer,{width:"100%",height:150},
            React.createElement(LineChart,{data:allLa,margin:{top:0,right:0,bottom:0,left:-20}},
              React.createElement(XAxis,{dataKey:"date",tick:{fill:"#475569",fontSize:9},axisLine:false,tickLine:false}),
              React.createElement(YAxis,{tick:{fill:"#475569",fontSize:9},axisLine:false,tickLine:false,domain:[0,7]}),
              React.createElement(Tooltip,{contentStyle:{background:"#0f172a",border:"1px solid #1e293b",fontSize:11},formatter:(v,n,p)=>[v+" mmol ("+p.payload.timing+")","乳酸"]}),
              React.createElement(ReferenceLine,{y:1.5,stroke:"#4ade8055",strokeDasharray:"4 4",label:{value:"LT1",fill:"#4ade80",fontSize:9}}),
              React.createElement(ReferenceLine,{y:4,stroke:"#fb923c55",strokeDasharray:"4 4",label:{value:"LT2",fill:"#fb923c",fontSize:9}}),
              React.createElement(Line,{type:"monotone",dataKey:"value",stroke:"#a78bfa",strokeWidth:2,dot:{r:4,fill:"#a78bfa"}})
            )
          )
        ),
        React.createElement("div",null,
          React.createElement("div",{style:{fontSize:9,letterSpacing:3,color:"#475569",marginBottom:8}},"ゾーン分布"),
          React.createElement("div",{style:{display:"flex",gap:5}},
            ZONES.map(z=>{
              const cnt=sessions.filter(s=>s.zone===z.label).length,pct=sessions.length?Math.round(cnt/sessions.length*100):0;
              return React.createElement("div",{key:z.label,style:{flex:1,textAlign:"center"}},
                React.createElement("div",{style:{height:60,background:"#1e293b",borderRadius:3,display:"flex",alignItems:"flex-end",overflow:"hidden"}},
                  React.createElement("div",{style:{width:"100%",height:pct+"%",background:z.color,minHeight:pct>0?3:0}})
                ),
                React.createElement("div",{style:{fontSize:9,color:z.color,marginTop:2}},z.label),
                React.createElement("div",{style:{fontSize:8,color:"#475569"}},pct+"%")
              );
            })
          )
        )
      )
    )
  );
}

function lbl(text) {
  return React.createElement("div",{style:{fontSize:9,letterSpacing:3,color:"#475569",marginBottom:5,textTransform:"uppercase"}},text);
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
