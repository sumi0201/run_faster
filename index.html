<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RUN FASTER">
<title>RUN FASTER</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#06060e;color:#e2e8f0;font-family:'Courier New',monospace;font-size:14px}
input,select,textarea,button{font-family:'Courier New',monospace;-webkit-appearance:none;font-size:13px}
.header{background:#06060e;border-bottom:1px solid #1e293b;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header-title{font-size:8px;letter-spacing:6px;color:#334155}
.header-name{font-size:18px;font-weight:700;color:#f1f5f9}
.nav{display:flex;gap:5px}
.nav button{padding:6px 12px;font-size:11px;border:1px solid #1e293b;background:transparent;color:#64748b;cursor:pointer;border-radius:3px}
.nav button.active{border-color:#38bdf8;background:#0c4a6e;color:#38bdf8}
.statsbar{display:flex;border-bottom:1px solid #1e293b}
.stat{flex:1;padding:9px 10px;border-right:1px solid #1e293b}
.stat-label{font-size:8px;letter-spacing:3px;color:#475569;margin-bottom:2px}
.stat-value{font-size:13px;font-weight:700;color:#f1f5f9}
.content{padding:14px 16px;padding-bottom:60px}
.section-label{font-size:9px;letter-spacing:4px;color:#475569;margin-bottom:12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:9px;letter-spacing:3px;color:#475569;margin-bottom:5px;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;background:#0a0a14;border:1px solid #1e293b;color:#e2e8f0;border-radius:3px;outline:none}
.field textarea{resize:vertical;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pace-preview{margin-bottom:12px;padding:7px 10px;background:#0f172a;border:1px solid #1e293b;border-radius:3px;font-size:11px;color:#64748b}
.pace-preview span{color:#38bdf8;font-size:15px;font-weight:700}
.set-box{background:#0a0a18;border:1px solid #1e2d40;border-radius:4px;margin-bottom:8px;overflow:hidden}
.set-header{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid #1e2d40}
.set-header input{flex:1;background:transparent;border:none;border-bottom:1px solid #1e293b;border-radius:0;color:#e2e8f0;padding:4px 0;outline:none}
.rep-table{width:100%;border-collapse:collapse;font-size:11px}
.rep-table th{padding:5px 6px;color:#475569;font-weight:400;font-size:9px;text-align:left;white-space:nowrap;background:#0d1826}
.rep-table td{padding:2px 3px;border-top:1px solid #1e293b}
.rep-table input{width:100%;padding:4px 5px;background:#0a0a14;border:1px solid #1e293b;color:#e2e8f0;border-radius:3px;outline:none}
.set-summary{padding:6px 10px;border-top:1px solid #1e2d40;font-size:10px;color:#475569;display:flex;gap:12px;flex-wrap:wrap}
.la-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.la-row input{padding:8px 10px;background:#0a0a14;border:1px solid #1e293b;color:#e2e8f0;border-radius:3px;outline:none}
.la-badge{font-size:10px;min-width:32px}
.btn-primary{flex:1;padding:13px;background:#0369a1;border:none;color:#e0f2fe;font-size:12px;letter-spacing:2px;cursor:pointer;border-radius:3px}
.btn-secondary{padding:13px 16px;background:transparent;border:1px solid #1e293b;color:#64748b;font-size:11px;cursor:pointer;border-radius:3px}
.btn-add{padding:6px 14px;background:transparent;border:1px dashed #1e293b;color:#475569;font-size:10px;cursor:pointer;border-radius:3px;margin-bottom:14px}
.btn-add-la{padding:5px 12px;background:transparent;border:1px dashed #3b2a5e;color:#7c3aed;font-size:10px;cursor:pointer;border-radius:3px;margin-bottom:14px}
.btn-icon{background:transparent;border:none;color:#475569;cursor:pointer;font-size:14px;padding:0 4px}
.btn-del-set{padding:4px 8px;background:transparent;border:1px solid #3b1f1f;color:#f87171;font-size:10px;cursor:pointer;border-radius:3px}
.btn-add-rep{padding:4px 10px;background:#0f2d40;border:1px solid #0369a1;color:#38bdf8;font-size:10px;cursor:pointer;border-radius:3px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.btn-new{padding:7px 16px;background:#0369a1;border:none;color:#e0f2fe;font-size:11px;cursor:pointer;border-radius:3px}
.session-card{background:#0a0a14;border:1px solid #1e293b;border-radius:5px;overflow:hidden;margin-bottom:6px}
.session-row{display:grid;grid-template-columns:60px 68px 1fr auto;gap:8px;align-items:center;padding:11px 12px;cursor:pointer}
.session-date{font-size:10px;color:#64748b}
.session-type{font-size:9px;padding:2px 5px;border-radius:3px;text-align:center;border:1px solid}
.session-data{font-size:12px;font-weight:600;color:#f1f5f9;display:flex;gap:8px;flex-wrap:wrap}
.session-note{font-size:10px;color:#475569;margin-top:2px;font-style:italic}
.dots{display:flex;gap:2px;align-items:center}
.dot{width:4px;height:4px;border-radius:50%}
.expand-arrow{font-size:9px;color:#475569;margin-left:4px}
.detail{border-top:1px solid #1e293b;padding:12px}
.detail-set-label{font-size:10px;color:#38bdf8;letter-spacing:2px;margin-bottom:5px}
.detail-table{border-collapse:collapse;font-size:11px;min-width:400px}
.detail-table th{padding:4px 7px;color:#475569;font-weight:400;font-size:9px;text-align:left;white-space:nowrap}
.detail-table td{padding:4px 7px;border-top:1px solid #1a2030}
.la-timeline{margin-bottom:10px}
.la-tl-label{font-size:9px;letter-spacing:3px;color:#7c3aed;margin-bottom:5px}
.la-bars{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.la-bar-wrap{text-align:center;min-width:50px}
.la-bar-val{font-size:11px;font-weight:700;margin-bottom:2px}
.la-bar-outer{height:42px;width:34px;margin:0 auto;background:#1e293b;border-radius:3px;display:flex;align-items:flex-end;overflow:hidden}
.la-bar-inner{width:100%;min-height:3px}
.la-bar-timing{font-size:9px;color:#475569;margin-top:3px}
.detail-actions{display:flex;gap:8px;margin-top:8px}
.btn-edit{padding:5px 12px;background:transparent;border:1px solid #1e293b;color:#64748b;font-size:11px;cursor:pointer;border-radius:3px}
.btn-del{padding:5px 12px;background:transparent;border:1px solid #3b1f1f;color:#f87171;font-size:11px;cursor:pointer;border-radius:3px}
.trend-box{padding:16px;background:#0a0a14;border-radius:6px;margin-bottom:16px}
.trend-title{font-size:9px;letter-spacing:4px;color:#475569;margin-bottom:5px}
.trend-value{font-size:22px;font-weight:700}
.trend-desc{font-size:12px;color:#94a3b8;margin-top:5px}
.chart-label{font-size:9px;letter-spacing:3px;color:#475569;margin-bottom:8px}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:100px;margin-bottom:20px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-col-bar{width:100%;background:#0369a1;border-radius:3px 3px 0 0;min-height:2px}
.bar-col-label{font-size:8px;color:#475569;text-align:center}
.line-chart-wrap{height:100px;position:relative;margin-bottom:20px;overflow:hidden}
.zone-bars{display:flex;gap:5px;margin-bottom:20px}
.zone-col{flex:1;text-align:center}
.zone-col-bar-wrap{height:60px;background:#1e293b;border-radius:3px;display:flex;align-items:flex-end;overflow:hidden}
.zone-col-bar{width:100%;min-height:0}
.zone-col-label{font-size:9px;margin-top:2px}
.zone-col-pct{font-size:8px;color:#475569}
.cond-btn{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;font-size:14px}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">TRAINING LOG</div>
    <div class="header-name">RUN FASTER</div>
  </div>
  <div class="nav">
    <button id="nav-log" class="active" onclick="showView('log')">記録</button>
    <button id="nav-add" onclick="showView('add')">追加</button>
    <button id="nav-stats" onclick="showView('stats')">分析</button>
  </div>
</div>

<div class="statsbar">
  <div class="stat"><div class="stat-label">今週</div><div class="stat-value" id="stat-week">0km</div></div>
  <div class="stat"><div class="stat-label">総距離</div><div class="stat-value" id="stat-total">0km</div></div>
  <div class="stat"><div class="stat-label">記録</div><div class="stat-value" id="stat-count">0本</div></div>
  <div class="stat"><div class="stat-label">傾向</div><div class="stat-value" id="stat-trend">—</div></div>
</div>

<div class="content">

<!-- LOG VIEW -->
<div id="view-log">
  <div class="top-bar">
    <div class="section-label">// セッション一覧</div>
    <button class="btn-new" onclick="showView('add')">＋追加</button>
  </div>
  <div id="session-list"></div>
</div>

<!-- ADD VIEW -->
<div id="view-add" style="display:none">
  <div class="section-label" id="form-title">// 新規セッション</div>

  <div class="grid2">
    <div class="field"><label>日付</label><input type="date" id="f-date"></div>
    <div class="field"><label>種別</label>
      <select id="f-type">
        <option>回復ジョグ</option><option>閾値</option><option selected>インターバル</option>
        <option>ロング走</option><option>レース</option><option>プレハブ</option><option>その他</option>
      </select>
    </div>
  </div>
  <div class="grid2">
    <div class="field"><label>ゾーン</label>
      <select id="f-zone" onchange="updateZoneColor()">
        <option value="Z1">Z1 — 回復</option><option value="Z2">Z2 — 有酸素基礎</option>
        <option value="Z3" selected>Z3 — 閾値</option><option value="Z4">Z4 — VO2max</option>
        <option value="Z5">Z5 — 無酸素</option><option value="Z6">Z6 — 最大</option>
      </select>
    </div>
    <div class="field"><label id="cond-label">コンディション — 普通</label>
      <div style="display:flex;gap:6px;align-items:center;height:38px" id="cond-btns"></div>
    </div>
  </div>
  <div class="grid2">
    <div class="field"><label>距離(km)</label><input type="number" id="f-dist" step="0.1" placeholder="16" oninput="updatePacePreview()"></div>
    <div class="field"><label>平均心拍</label><input type="number" id="f-hr" placeholder="165"></div>
  </div>
  <div class="grid2">
    <div class="field"><label>時間 — 分</label><input type="number" id="f-dur-m" placeholder="58" min="0" oninput="updatePacePreview()"></div>
    <div class="field"><label>時間 — 秒</label><input type="number" id="f-dur-s" placeholder="30" min="0" max="59" oninput="updatePacePreview()"></div>
  </div>
  <div class="pace-preview" id="pace-preview" style="display:none">平均ペース <span id="pace-val"></span> /km</div>

  <div class="section-label" style="color:#0369a1">// インターバル詳細</div>
  <div id="sets-container"></div>
  <button class="btn-add" onclick="addSet()">＋セット追加</button>

  <div class="section-label" style="color:#7c3aed">// 乳酸測定</div>
  <div id="la-container"></div>
  <button class="btn-add-la" onclick="addLa()">＋測定追加</button>

  <div class="field"><label id="rpe-label">RPE 主観的強度 — 未入力</label>
    <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap" id="rpe-btns"></div>
  </div>

  <div class="field"><label>メモ</label><textarea id="f-note" rows="2" placeholder="今日の感覚…"></textarea></div>

  <div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn-primary" onclick="submitForm()" id="submit-btn">記録する</button>
    <button class="btn-secondary" onclick="showView('log')">キャンセル</button>
  </div>
</div>

<!-- STATS VIEW -->
<div id="view-stats" style="display:none">
  <div class="section-label">// 分析・予測</div>
  <div class="trend-box" id="trend-box" style="border:1px solid #166534">
    <div class="trend-title">トレンド予測</div>
    <div class="trend-value" id="trend-value">—</div>
    <div class="trend-desc" id="trend-desc"></div>
  </div>
  <div class="chart-label">週間走行距離 (km)</div>
  <div class="bar-chart" id="weekly-chart"></div>
  <div class="chart-label">ペース推移</div>
  <div id="pace-chart" style="margin-bottom:20px"></div>
  <div class="chart-label">乳酸値 全測定ポイント</div>
  <div id="la-chart" style="margin-bottom:20px"></div>
  <div class="chart-label">ゾーン分布</div>
  <div class="zone-bars" id="zone-chart"></div>
</div>

</div>

<script>
const ZONES={Z1:"#4ade80",Z2:"#a3e635",Z3:"#facc15",Z4:"#fb923c",Z5:"#f87171",Z6:"#e879f9"};
const COND=["最悪","悪い","普通","良い","最高"];
const KEY="runfaster_v3";

let sessions=[];
let editId=null;
let expandedId=null;
let formCondition=3;
let formRpe=null;
const RPE_DESC=["","非常に楽","楽","ややきつくない","ややきつい","きつい","かなりきつい","とてもきつい","非常にきつい","限界手前","オールアウト"];
let formSets=[];
let formLa=[];

function p2n(p){if(!p)return null;const[m,s]=p.split(":").map(Number);return isNaN(m)?null:m+(s||0)/60;}
function n2p(n){if(!n||isNaN(n))return"—";const m=Math.floor(n),s=Math.round((n-m)*60);return m+":"+(s<10?"0":"")+s;}
function fp(d,t){return(!d||!t)?"—":n2p(t/d);}
// time string "1:08" or "68" or "1:08.5" -> total seconds
function t2s(t){if(!t)return null;t=(""+t).trim();if(t.indexOf(":")>=0){const[m,s]=t.split(":");const mm=parseFloat(m),ss=parseFloat(s);return isNaN(mm)?null:mm*60+(ss||0);}const v=parseFloat(t);return isNaN(v)?null:v;}
// seconds -> "1:08"
function s2t(sec){if(sec==null||isNaN(sec))return"—";const m=Math.floor(sec/60),s=sec-m*60;const ss=(Math.round(s*10)/10);return m>0?(m+":"+(ss<10?"0":"")+ss):(""+ss);}
// pace per km (min/km) from distance(m) and time(sec)
function repPace(distM,timeSec){if(!distM||!timeSec)return null;return (timeSec/(distM/1000))/60;}
function wk(ds){const d=new Date(ds),dy=d.getDay(),diff=d.getDate()-dy+(dy===0?-6:1),mo=new Date(d.setDate(diff));return(mo.getMonth()+1)+"/"+(mo.getDate());}
function zc(z){return ZONES[z]||"#94a3b8";}
function save(){try{localStorage.setItem(KEY,JSON.stringify(sessions));}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(s)sessions=JSON.parse(s);}catch(e){}
  if(!sessions.length)sessions=[
    {id:1,date:"2026-05-28",type:"インターバル",distance:16,duration:68,hrAvgSession:170,condition:5,rpe:8,zone:"Z4",note:"過去最高の感覚",
     intervalSets:[{setLabel:"インターバル",setDist:1000,restType:"jog",reps:[
       {time:"3:03",dist:"",hrPeak:176,hrAvg:170,hrRest:124,rest:"90",lactate:3.8,note:""},
       {time:"3:02",dist:"",hrPeak:178,hrAvg:172,hrRest:120,rest:"90",lactate:4.1,note:""},
       {time:"3:00",dist:"",hrPeak:182,hrAvg:176,hrRest:115,rest:"90",lactate:4.5,note:""},
       {time:"2:58",dist:"",hrPeak:186,hrAvg:180,hrRest:112,rest:"90",lactate:4.8,note:"ラスト全力"},
     ]}],
     lactateMeasurements:[{timing:"WU後",value:1.0},{timing:"5本目後",value:4.2},{timing:"終了後",value:4.8}]},
    {id:2,date:"2026-05-27",type:"回復ジョグ",distance:10,duration:58,hrAvgSession:132,condition:3,rpe:3,zone:"Z1",note:"朝。筋肉痛あり",intervalSets:[],lactateMeasurements:[]},
    {id:3,date:"2026-05-25",type:"閾値",distance:16,duration:70,hrAvgSession:158,condition:4,rpe:6,zone:"Z3",note:"安定して走れた",
     intervalSets:[{setLabel:"変化走",setDist:"",restType:"jog",reps:[
       {time:"3:18",dist:1000,hrPeak:162,hrAvg:158,hrRest:130,rest:"60",lactate:3.5,note:""},
       {time:"6:36",dist:2000,hrPeak:163,hrAvg:159,hrRest:128,rest:"60",lactate:3.8,note:""},
       {time:"3:16",dist:1000,hrPeak:165,hrAvg:161,hrRest:124,rest:"60",lactate:4.0,note:""},
       {time:"6:30",dist:2000,hrPeak:167,hrAvg:163,hrRest:122,rest:"",lactate:4.2,note:"ラスト上げ"},
     ]}],
     lactateMeasurements:[{timing:"WU後",value:1.1},{timing:"終了後",value:4.0}]},
  ];
}

function showView(v){
  ["log","add","stats"].forEach(x=>{
    document.getElementById("view-"+x).style.display=x===v?"block":"none";
    document.getElementById("nav-"+x).classList.toggle("active",x===v);
  });
  if(v==="log"){renderList();updateStats();}
  if(v==="stats")renderStats();
  if(v==="add"&&!editId)initForm();
}

// ── CONDITION BUTTONS ──
function initCondBtns(){
  const c=document.getElementById("cond-btns");c.innerHTML="";
  for(let n=1;n<=5;n++){
    const b=document.createElement("button");
    b.className="cond-btn";b.textContent="●";b.dataset.n=n;
    b.style.background=formCondition>=n?"#38bdf8":"#1e293b";
    b.style.color=formCondition>=n?"#000":"#475569";
    b.onclick=()=>{formCondition=n;initCondBtns();document.getElementById("cond-label").textContent="コンディション — "+COND[n-1];};
    c.appendChild(b);
  }
}

function rpeColor(n){if(n<=3)return"#4ade80";if(n<=5)return"#a3e635";if(n<=7)return"#facc15";if(n<=9)return"#fb923c";return"#f87171";}

function initRpeBtns(){
  const c=document.getElementById("rpe-btns");c.innerHTML="";
  for(let n=1;n<=10;n++){
    const b=document.createElement("button");
    b.textContent=n;
    b.style="width:28px;height:28px;border-radius:4px;border:none;cursor:pointer;font-size:12px;font-family:'Courier New',monospace;"+
      (formRpe===n?("background:"+rpeColor(n)+";color:#000;font-weight:700"):"background:#1e293b;color:#475569");
    b.onclick=()=>{formRpe=n;initRpeBtns();document.getElementById("rpe-label").textContent="RPE 主観的強度 — "+n+" ("+RPE_DESC[n]+")";};
    c.appendChild(b);
  }
}

function updateZoneColor(){
  const s=document.getElementById("f-zone");
  s.style.color=zc(s.value);
}

function updatePacePreview(){
  const d=parseFloat(document.getElementById("f-dist").value);
  const dm=parseFloat(document.getElementById("f-dur-m").value)||0;
  const ds=parseFloat(document.getElementById("f-dur-s").value)||0;
  const t=dm+(ds/60);
  const p=document.getElementById("pace-preview");
  if(d&&t){p.style.display="block";document.getElementById("pace-val").textContent=n2p(t/d);}
  else p.style.display="none";
}

// ── SETS ──
function renderSets(){
  const c=document.getElementById("sets-container");c.innerHTML="";
  formSets.forEach((set,si)=>{
    const box=document.createElement("div");box.className="set-box";
    // header: label + default distance + rest type
    const hdr=document.createElement("div");hdr.className="set-header";
    const inp=document.createElement("input");inp.placeholder="セット名 (例: インターバル)";inp.value=set.setLabel;
    inp.oninput=e=>formSets[si].setLabel=e.target.value;
    const distInp=document.createElement("input");distInp.type="number";distInp.placeholder="既定m";distInp.value=set.setDist||"";
    distInp.style.flex="0";distInp.style.width="64px";distInp.style.borderBottom="1px solid #0369a1";distInp.style.color="#38bdf8";
    distInp.oninput=e=>{formSets[si].setDist=e.target.value?parseFloat(e.target.value):"";renderSets();};
    const restSel=document.createElement("select");restSel.style="flex:0;width:74px;background:#0a0a14;border:1px solid #1e293b;color:#4ade80;border-radius:3px;padding:3px;font-size:10px";
    ["jog","その場"].forEach(o=>{const op=document.createElement("option");op.value=o;op.textContent="休:"+o;if((set.restType||"jog")===o)op.selected=true;restSel.appendChild(op);});
    restSel.onchange=e=>{formSets[si].restType=e.target.value;};
    const addRepBtn=document.createElement("button");addRepBtn.className="btn-add-rep";addRepBtn.textContent="+本";addRepBtn.onclick=()=>{formSets[si].reps.push({time:"",dist:"",hrPeak:"",hrAvg:"",hrRest:"",rest:"",lactate:"",note:""});renderSets();};
    hdr.appendChild(inp);hdr.appendChild(distInp);hdr.appendChild(restSel);hdr.appendChild(addRepBtn);
    if(formSets.length>1){const db=document.createElement("button");db.className="btn-del-set";db.textContent="削除";db.onclick=()=>{formSets.splice(si,1);renderSets();};hdr.appendChild(db);}
    box.appendChild(hdr);
    // table
    const wrap=document.createElement("div");wrap.style.overflowX="auto";
    const tbl=document.createElement("table");tbl.className="rep-table";
    tbl.innerHTML='<thead><tr><th>#</th><th>距離m</th><th>タイム</th><th>ペース</th><th>HR最高</th><th>HR平均</th><th>レスト後HR</th><th>つなぎ秒</th><th>乳酸</th><th>メモ</th><th></th></tr></thead>';
    const tbody=document.createElement("tbody");
    set.reps.forEach((rep,ri)=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`<td style="color:#475569;padding:4px 6px">${ri+1}</td>`;
      // dist (override; placeholder shows set default)
      const tdD=document.createElement("td");
      const inpD=document.createElement("input");inpD.type="number";inpD.placeholder=set.setDist||"m";inpD.value=rep.dist||"";inpD.style.minWidth="48px";inpD.style.color="#38bdf8";
      inpD.oninput=e=>{formSets[si].reps[ri].dist=e.target.value;updatePaceCell(si,ri);};
      tdD.appendChild(inpD);tr.appendChild(tdD);
      // time
      const tdT=document.createElement("td");
      const inpT=document.createElement("input");inpT.type="text";inpT.placeholder="1:08";inpT.value=rep.time||"";inpT.style.minWidth="52px";
      inpT.oninput=e=>{formSets[si].reps[ri].time=e.target.value;updatePaceCell(si,ri);};
      tdT.appendChild(inpT);tr.appendChild(tdT);
      // pace auto
      const tdP=document.createElement("td");
      const pSpan=document.createElement("span");pSpan.id="pace-"+si+"-"+ri;pSpan.style.color="#38bdf8";pSpan.style.fontSize="10px";
      const ed=rep.dist||set.setDist;const pc=repPace(ed,t2s(rep.time));pSpan.textContent=pc?n2p(pc):"—";
      tdP.appendChild(pSpan);tr.appendChild(tdP);
      // other fields
      [["hrPeak","182","number"],["hrAvg","175","number"],["hrRest","120","number"],["rest","90","number"],["lactate","4.2","number"],["note","","text"]].forEach(([key,ph,type])=>{
        const td=document.createElement("td");
        const inp2=document.createElement("input");inp2.type=type;inp2.placeholder=ph;inp2.value=rep[key]||"";
        if(key==="lactate")inp2.step="0.1";
        inp2.style.minWidth=key==="note"?"80px":"46px";
        inp2.oninput=e=>{formSets[si].reps[ri][key]=e.target.value;};
        td.appendChild(inp2);tr.appendChild(td);
      });
      const tdx=document.createElement("td");
      if(set.reps.length>1){const x=document.createElement("button");x.className="btn-icon";x.textContent="×";x.onclick=()=>{formSets[si].reps.splice(ri,1);renderSets();};tdx.appendChild(x);}
      tr.appendChild(tdx);tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);wrap.appendChild(tbl);box.appendChild(wrap);
    // summary
    const times=set.reps.map(r=>t2s(r.time)).filter(Boolean);
    const paces=set.reps.map(r=>repPace(r.dist||set.setDist,t2s(r.time))).filter(Boolean);
    const hrs=set.reps.map(r=>parseInt(r.hrAvg)).filter(Boolean);
    const rsts=set.reps.map(r=>parseInt(r.hrRest)).filter(Boolean);
    if(times.length){
      const sum=document.createElement("div");sum.className="set-summary";
      sum.innerHTML=`本数 <span style="color:#e2e8f0">${times.length}</span>`+
        (paces.length?` &nbsp; avgペース <span style="color:#38bdf8">${n2p(paces.reduce((a,b)=>a+b,0)/paces.length)}/km</span>`:"")+
        (hrs.length?` &nbsp; avgHR <span style="color:#fb923c">${Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length)}</span>`:"")+
        (rsts.length?` &nbsp; minRestHR <span style="color:#4ade80">${Math.min(...rsts)}</span>`:"");
      box.appendChild(sum);
    }
    c.appendChild(box);
  });
}

function updatePaceCell(si,ri){
  const set=formSets[si];const span=document.getElementById("pace-"+si+"-"+ri);
  if(span){const ed=set.reps[ri].dist||set.setDist;const pc=repPace(ed,t2s(set.reps[ri].time));span.textContent=pc?n2p(pc):"—";}
}

function addSet(){formSets.push({setLabel:"",setDist:"",restType:"jog",reps:[{time:"",dist:"",hrPeak:"",hrAvg:"",hrRest:"",rest:"",lactate:"",note:""}]});renderSets();}

// ── LACTATE ──
function renderLa(){
  const c=document.getElementById("la-container");c.innerHTML="";
  formLa.forEach((m,i)=>{
    const row=document.createElement("div");row.className="la-row";
    const t=document.createElement("input");t.placeholder="タイミング (WU後, 3本目後…)";t.value=m.timing;t.style.flex="2";t.oninput=e=>formLa[i].timing=e.target.value;
    const v=document.createElement("input");v.type="number";v.step="0.1";v.placeholder="mmol";v.value=m.value;v.style.flex="0.8";v.style.width="80px";
    v.oninput=e=>{formLa[i].value=e.target.value;badge.textContent=getBadge(e.target.value);badge.style.color=getBadgeColor(e.target.value);};
    const badge=document.createElement("div");badge.className="la-badge";badge.textContent=getBadge(m.value);badge.style.color=getBadgeColor(m.value);
    row.appendChild(t);row.appendChild(v);row.appendChild(badge);
    if(formLa.length>1){const x=document.createElement("button");x.className="btn-icon";x.textContent="×";x.onclick=()=>{formLa.splice(i,1);renderLa();};row.appendChild(x);}
    c.appendChild(row);
  });
}

function getBadge(v){const n=parseFloat(v);if(!v||isNaN(n))return"";return n>4?"LT2↑":n>1.5?"LT1↑":"有酸";}
function getBadgeColor(v){const n=parseFloat(v);if(!v||isNaN(n))return"#475569";return n>4?"#fb923c":n>1.5?"#facc15":"#4ade80";}
function addLa(){formLa.push({timing:"",value:""});renderLa();}

function initForm(){
  editId=null;formCondition=3;formRpe=null;
  formSets=[{setLabel:"",setDist:"",restType:"jog",reps:[{time:"",dist:"",hrPeak:"",hrAvg:"",hrRest:"",rest:"",lactate:"",note:""}]}];
  formLa=[{timing:"",value:""}];
  document.getElementById("form-title").textContent="// 新規セッション";
  document.getElementById("submit-btn").textContent="記録する";
  document.getElementById("f-date").value=new Date().toISOString().split("T")[0];
  document.getElementById("f-type").value="インターバル";
  document.getElementById("f-zone").value="Z3";
  document.getElementById("f-dist").value="";
  document.getElementById("f-dur-m").value="";
  document.getElementById("f-dur-s").value="";
  document.getElementById("f-hr").value="";
  document.getElementById("f-note").value="";
  document.getElementById("pace-preview").style.display="none";
  document.getElementById("cond-label").textContent="コンディション — 普通";
  document.getElementById("rpe-label").textContent="RPE 主観的強度 — 未入力";
  updateZoneColor();initCondBtns();initRpeBtns();renderSets();renderLa();
}

function loadForm(s){
  editId=s.id;formCondition=s.condition||3;formRpe=s.rpe||null;
  formSets=JSON.parse(JSON.stringify(s.intervalSets?.length?s.intervalSets:[{setLabel:"",setDist:"",restType:"jog",reps:[{time:"",dist:"",hrPeak:"",hrAvg:"",hrRest:"",rest:"",lactate:"",note:""}]}]));
  formLa=JSON.parse(JSON.stringify(s.lactateMeasurements?.length?s.lactateMeasurements:[{timing:"",value:""}]));
  document.getElementById("form-title").textContent="// セッション編集";
  document.getElementById("submit-btn").textContent="更新する";
  document.getElementById("f-date").value=s.date;
  document.getElementById("f-type").value=s.type;
  document.getElementById("f-zone").value=s.zone;
  document.getElementById("f-dist").value=s.distance||"";
  const durM=Math.floor(s.duration||0);
  const durS=Math.round(((s.duration||0)-durM)*60);
  document.getElementById("f-dur-m").value=durM||"";
  document.getElementById("f-dur-s").value=durS||"";
  document.getElementById("f-hr").value=s.hrAvgSession||"";
  document.getElementById("f-note").value=s.note||"";
  document.getElementById("cond-label").textContent="コンディション — "+COND[formCondition-1];
  document.getElementById("rpe-label").textContent=formRpe?("RPE 主観的強度 — "+formRpe+" ("+RPE_DESC[formRpe]+")"):"RPE 主観的強度 — 未入力";
  updateZoneColor();updatePacePreview();initCondBtns();initRpeBtns();renderSets();renderLa();
  showView("add");
}

function submitForm(){
  const date=document.getElementById("f-date").value;
  const dist=parseFloat(document.getElementById("f-dist").value);
  if(!date||!dist)return alert("日付と距離は必須です");
  const entry={
    id:editId||Date.now(),date,
    type:document.getElementById("f-type").value,
    distance:dist,
    duration:(parseFloat(document.getElementById("f-dur-m").value)||0)+(parseFloat(document.getElementById("f-dur-s").value)||0)/60,
    hrAvgSession:parseInt(document.getElementById("f-hr").value)||null,
    condition:formCondition,
    rpe:formRpe,
    zone:document.getElementById("f-zone").value,
    note:document.getElementById("f-note").value,
    lactateMeasurements:formLa.filter(m=>m.value!=="").map(m=>({...m,value:parseFloat(m.value)})),
    intervalSets:formSets.map(set=>({setLabel:set.setLabel,setDist:set.setDist?parseFloat(set.setDist):null,restType:set.restType||"jog",reps:set.reps.map(r=>({
      time:r.time||"",dist:r.dist?parseFloat(r.dist):null,hrPeak:r.hrPeak?parseInt(r.hrPeak):null,hrAvg:r.hrAvg?parseInt(r.hrAvg):null,
      hrRest:r.hrRest?parseInt(r.hrRest):null,rest:r.rest?parseInt(r.rest):null,lactate:r.lactate?parseFloat(r.lactate):null,note:r.note||"",
    }))}))
  };
  if(editId)sessions=sessions.map(s=>s.id===editId?entry:s);
  else sessions.unshift(entry);
  sessions.sort((a,b)=>b.date.localeCompare(a.date));
  save();editId=null;showView("log");
}

// ── RENDER LIST ──
function renderList(){
  const c=document.getElementById("session-list");c.innerHTML="";
  sessions.forEach(s=>{
    const rPacesArr=[];(s.intervalSets||[]).forEach(set=>set.reps.forEach(r=>{const pc=repPace(r.dist||set.setDist,t2s(r.time));if(pc)rPacesArr.push(pc);}));
    const avgRP=rPacesArr.length?rPacesArr.reduce((a,b)=>a+b,0)/rPacesArr.length:null;
    const allReps=s.intervalSets?.flatMap(x=>x.reps)||[];
    const minRest=allReps.map(r=>r.hrRest).filter(Boolean);
    const laVals=s.lactateMeasurements?.filter(m=>m.value).map(m=>m.value)||[];
    const maxLa=laVals.length?Math.max(...laVals):null;
    const exp=expandedId===s.id;

    const card=document.createElement("div");card.className="session-card";

    // main row
    const row=document.createElement("div");row.className="session-row";
    row.onclick=()=>{expandedId=exp?null:s.id;renderList();};
    row.innerHTML=`
      <div class="session-date">${s.date.slice(5)}</div>
      <div class="session-type" style="color:${zc(s.zone)};border-color:${zc(s.zone)}44">${s.type}</div>
      <div>
        <div class="session-data">
          <span>${s.distance}km</span>
          <span style="color:#475569;font-weight:400">${fp(s.distance,s.duration)}</span>
          ${avgRP?`<span style="color:#38bdf8">rep ${n2p(avgRP)}</span>`:""}
          ${s.hrAvgSession?`<span style="color:#fb923c;font-weight:400">♥${s.hrAvgSession}</span>`:""}
          ${minRest.length?`<span style="color:#4ade80;font-weight:400">↓${Math.min(...minRest)}</span>`:""}
          ${maxLa?`<span style="color:${maxLa>4?"#f87171":maxLa>1.5?"#facc15":"#a78bfa"};font-weight:400">La${maxLa}</span>`:""}
          ${s.rpe?`<span style="color:${rpeColor(s.rpe)};font-weight:400">RPE${s.rpe}</span>`:""}
        </div>
        ${s.note?`<div class="session-note">${s.note}</div>`:""}
      </div>
      <div style="display:flex;align-items:center">
        <div class="dots">${[1,2,3,4,5].map(n=>`<div class="dot" style="background:${s.condition>=n?"#38bdf8":"#1e293b"}"></div>`).join("")}</div>
        <span class="expand-arrow">${exp?"▲":"▼"}</span>
      </div>
    `;
    card.appendChild(row);

    if(exp){
      const det=document.createElement("div");det.className="detail";
      // interval sets
      (s.intervalSets||[]).forEach(set=>{
        if(!set.reps?.length)return;
        const sl=document.createElement("div");sl.className="detail-set-label";sl.textContent=set.setLabel||"セット";det.appendChild(sl);
        const wrap=document.createElement("div");wrap.style.overflowX="auto";
        const restLabel=set.restType==="その場"?"その場":"jog";
        const tbl=document.createElement("table");tbl.className="detail-table";
        tbl.innerHTML='<thead><tr><th>#</th><th>距離</th><th>タイム</th><th>ペース</th><th>HR最</th><th>HR均</th><th>レスト後</th><th>つなぎ('+restLabel+')</th><th>乳酸</th><th>メモ</th></tr></thead>';
        const tb=document.createElement("tbody");
        set.reps.forEach((r,ri)=>{
          const ed=r.dist||set.setDist;
          const pc=repPace(ed,t2s(r.time));
          const ppPrev=ri>0?repPace(set.reps[ri-1].dist||set.setDist,t2s(set.reps[ri-1].time)):null;
          const faster=ppPrev&&pc&&pc<ppPrev;
          const tr=document.createElement("tr");
          tr.innerHTML=`
            <td style="color:#475569">${ri+1}</td>
            <td style="color:#38bdf8">${ed?ed+"m":"—"}</td>
            <td style="font-weight:600;color:${faster?"#4ade80":"#e2e8f0"}">${r.time||"—"}${faster?" ↑":""}</td>
            <td style="color:#38bdf8">${pc?n2p(pc):"—"}</td>
            <td style="color:#f87171">${r.hrPeak||"—"}</td>
            <td style="color:#fb923c">${r.hrAvg||"—"}</td>
            <td style="color:#4ade80">${r.hrRest||"—"}</td>
            <td style="color:#64748b">${r.rest?r.rest+"s":"—"}</td>
            <td style="color:${r.lactate>4?"#f87171":r.lactate>1.5?"#facc15":"#a78bfa"}">${r.lactate||"—"}</td>
            <td style="color:#64748b;font-style:italic">${r.note||""}</td>
          `;
          tb.appendChild(tr);
        });
        tbl.appendChild(tb);wrap.appendChild(tbl);det.appendChild(wrap);
        // set summary
        const pcs=set.reps.map(r=>repPace(r.dist||set.setDist,t2s(r.time))).filter(Boolean);
        const has=set.reps.map(r=>parseInt(r.hrAvg)).filter(Boolean);
        const rsts=set.reps.map(r=>parseInt(r.hrRest)).filter(Boolean);
        if(pcs.length){
          const sm=document.createElement("div");sm.style="font-size:10px;color:#475569;margin-top:5px;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px";
          sm.innerHTML=`avgペース <span style="color:#38bdf8">${n2p(pcs.reduce((a,b)=>a+b,0)/pcs.length)}</span>`+
            ` &nbsp; best <span style="color:#4ade80">${n2p(Math.min(...pcs))}</span>`+
            (has.length?` &nbsp; avgHR <span style="color:#fb923c">${Math.round(has.reduce((a,b)=>a+b,0)/has.length)}</span>`:"")+
            (rsts.length?` &nbsp; minRestHR <span style="color:#4ade80">${Math.min(...rsts)}</span>`:"");
          det.appendChild(sm);
        }
      });
      // lactate timeline
      const laFil=s.lactateMeasurements?.filter(m=>m.value)||[];
      if(laFil.length){
        const lt=document.createElement("div");lt.className="la-timeline";
        lt.innerHTML=`<div class="la-tl-label">乳酸タイムライン</div>`;
        const bars=document.createElement("div");bars.className="la-bars";
        laFil.forEach(m=>{
          const pct=Math.min(100,(m.value/7)*100);
          const col=m.value>4?"#f87171":m.value>1.5?"#facc15":"#4ade80";
          bars.innerHTML+=`<div class="la-bar-wrap">
            <div class="la-bar-val" style="color:${col}">${m.value}</div>
            <div class="la-bar-outer"><div class="la-bar-inner" style="height:${pct}%;background:${col}"></div></div>
            <div class="la-bar-timing">${m.timing}</div>
          </div>`;
        });
        lt.appendChild(bars);det.appendChild(lt);
      }
      // actions
      const acts=document.createElement("div");acts.className="detail-actions";
      const eb=document.createElement("button");eb.className="btn-edit";eb.textContent="編集";eb.onclick=()=>loadForm(s);
      const db=document.createElement("button");db.className="btn-del";db.textContent="削除";
      db.onclick=()=>{if(confirm("削除しますか？")){sessions=sessions.filter(x=>x.id!==s.id);save();expandedId=null;renderList();updateStats();}};
      acts.appendChild(eb);acts.appendChild(db);det.appendChild(acts);
      card.appendChild(det);
    }
    c.appendChild(card);
  });
}

// ── STATS ──
function updateStats(){
  const total=sessions.reduce((a,b)=>a+(b.distance||0),0);
  const tw=sessions.filter(s=>(Date.now()-new Date(s.date))/864e5<=7).reduce((a,b)=>a+(b.distance||0),0);
  document.getElementById("stat-week").textContent=tw+"km";
  document.getElementById("stat-total").textContent=total+"km";
  document.getElementById("stat-count").textContent=sessions.length+"本";
  const pd=sessions.filter(s=>s.distance&&s.duration).slice(0,6).map(s=>s.duration/s.distance);
  if(pd.length>=3){
    const f=pd.slice(0,3).reduce((a,b)=>a+b,0)/3,l=pd.slice(-3).reduce((a,b)=>a+b,0)/3,t=l-f;
    const up=t<0;
    document.getElementById("stat-trend").textContent=(up?"▲":"▼")+Math.abs(t).toFixed(2);
    document.getElementById("stat-trend").style.color=up?"#4ade80":"#f87171";
  }
}

function renderStats(){
  // trend
  const pd=sessions.filter(s=>s.distance&&s.duration).slice(0,6).map(s=>s.duration/s.distance);
  if(pd.length>=3){
    const avg=pd.reduce((a,b)=>a+b,0)/pd.length;
    const f=pd.slice(0,3).reduce((a,b)=>a+b,0)/3,l=pd.slice(-3).reduce((a,b)=>a+b,0)/3,t=l-f;
    const up=t<0;
    document.getElementById("trend-box").style.borderColor=up?"#166534":"#7f1d1d";
    document.getElementById("trend-value").textContent=up?"▲ 改善中":"▼ 要注意";
    document.getElementById("trend-value").style.color=up?"#4ade80":"#f87171";
    document.getElementById("trend-desc").innerHTML=`平均 <span style="color:#f1f5f9">${n2p(avg)}/km</span>。`+(up?Math.abs(t).toFixed(2)+"分速くなっています。":Math.abs(t).toFixed(2)+"分落ちています。回復を優先。");
  }

  // weekly bar chart
  const weeks={};
  sessions.forEach(s=>{const k=wk(s.date);if(!weeks[k])weeks[k]=0;weeks[k]+=s.distance||0;});
  const wArr=Object.entries(weeks).slice(-6);
  const maxW=Math.max(...wArr.map(x=>x[1]),1);
  const wc=document.getElementById("weekly-chart");wc.innerHTML="";
  wArr.forEach(([k,v])=>{
    wc.innerHTML+=`<div class="bar-col"><div class="bar-col-bar" style="height:${(v/maxW)*90}px"></div><div class="bar-col-label">${k}<br>${v}km</div></div>`;
  });

  // pace simple chart
  const pArr=[...sessions].filter(s=>s.distance&&s.duration).slice(0,10).reverse();
  const pc=document.getElementById("pace-chart");pc.innerHTML="";
  if(pArr.length){
    const pVals=pArr.map(s=>s.duration/s.distance);
    const minP=Math.min(...pVals),maxP=Math.max(...pVals),rangeP=maxP-minP||0.1;
    pc.style="display:flex;align-items:flex-end;gap:4px;height:80px;margin-bottom:20px";
    pArr.forEach((s,i)=>{
      const pct=((pVals[i]-minP)/rangeP)*70;
      const h=80-pct;
      pc.innerHTML+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
        <div style="font-size:8px;color:#38bdf8">${n2p(pVals[i])}</div>
        <div style="width:100%;background:#38bdf8;border-radius:3px 3px 0 0;height:${h}px;min-height:4px"></div>
        <div style="font-size:8px;color:#475569">${s.date.slice(5)}</div>
      </div>`;
    });
  }

  // lactate chart
  const laArr=[];
  [...sessions].reverse().forEach(s=>(s.lactateMeasurements||[]).forEach(m=>{if(m.value)laArr.push({date:s.date.slice(5),v:parseFloat(m.value),t:m.timing});}));
  const lc=document.getElementById("la-chart");lc.innerHTML="";
  if(laArr.length){
    lc.style="display:flex;align-items:flex-end;gap:3px;height:80px;margin-bottom:8px";
    laArr.slice(-15).forEach(p=>{
      const pct=Math.min(100,(p.v/7)*100);
      const col=p.v>4?"#f87171":p.v>1.5?"#facc15":"#4ade80";
      lc.innerHTML+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
        <div style="font-size:8px;color:${col}">${p.v}</div>
        <div style="width:100%;background:${col};border-radius:3px 3px 0 0;height:${pct*0.7}px;min-height:3px"></div>
        <div style="font-size:7px;color:#475569;text-align:center;line-height:1.2">${p.date}<br>${p.t}</div>
      </div>`;
    });
    const leg=document.createElement("div");leg.style="font-size:9px;color:#475569;display:flex;gap:12px;margin-bottom:16px";
    leg.innerHTML=`<span style="color:#4ade80">■ LT1以下(≤1.5)</span><span style="color:#facc15">■ LT1-LT2</span><span style="color:#f87171">■ LT2超(>4.0)</span>`;
    lc.insertAdjacentElement("afterend",leg);
  }

  // zone dist
  const zc2=document.getElementById("zone-chart");zc2.innerHTML="";
  ["Z1","Z2","Z3","Z4","Z5","Z6"].forEach(z=>{
    const cnt=sessions.filter(s=>s.zone===z).length;
    const pct=sessions.length?Math.round(cnt/sessions.length*100):0;
    zc2.innerHTML+=`<div class="zone-col">
      <div class="zone-col-bar-wrap"><div class="zone-col-bar" style="height:${pct}%;background:${ZONES[z]}"></div></div>
      <div class="zone-col-label" style="color:${ZONES[z]}">${z}</div>
      <div class="zone-col-pct">${pct}%</div>
    </div>`;
  });
}

// ── INIT ──
load();
showView("log");
initForm();
</script>
</body>
